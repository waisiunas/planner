            <script>
              document.addEventListener("DOMContentLoaded", async function () {
                if (window.__partialsReady) {
                  try {
                    await window.__partialsReady;
                  } catch (err) {
                    console.error("Failed to load partials", err);
                  }
                }

                const gridBtn = document.getElementById("gridViewBtn");
                const tableBtn = document.getElementById("tableViewBtn");
                const gridView = document.getElementById("gridView");
                const tableView = document.getElementById("tableView");

                // Stop if elements don't exist
                if (!gridBtn || !tableBtn || !gridView || !tableView) {
                  return;
                }

                const saved = localStorage.getItem("plansView") || "grid";
                setView(saved);

                gridBtn.addEventListener("click", function () {
                  setView("grid");
                });

                tableBtn.addEventListener("click", function () {
                  setView("table");
                });

                function setView(view) {
                  if (view === "grid") {
                    gridView.classList.remove("d-none");
                    tableView.classList.add("d-none");

                    gridBtn.classList.add("active");
                    tableBtn.classList.remove("active");
                  } else {
                    gridView.classList.add("d-none");
                    tableView.classList.remove("d-none");

                    tableBtn.classList.add("active");
                    gridBtn.classList.remove("active");
                  }

                  localStorage.setItem("plansView", view);
                }
              });

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("addPlanForm");
        if (!form) return;

        const fields = [
          { id: "title", name: "Title", type: "text" },
          { id: "start_date", name: "Start Date", type: "date" },
          { id: "end_date", name: "End Date", type: "date" },
          { id: "investment", name: "Investment", type: "number" },
          { id: "expected_return", name: "Expected Return", type: "number" },
          {
            id: "daily_collection_amount",
            name: "Daily Collection Amount",
            type: "number",
          },
        ];

        function clearError(input) {
          input.classList.remove("is-invalid");
          const next = input.parentNode.querySelector(".invalid-feedback");
          if (next) next.remove();
        }

        function setError(input, message) {
          input.classList.add("is-invalid");
          let next = input.parentNode.querySelector(".invalid-feedback");
          if (next) {
            next.textContent = message;
          } else {
            const div = document.createElement("div");
            div.className = "invalid-feedback";
            div.textContent = message;
            input.parentNode.appendChild(div);
          }
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          let valid = true;

          fields.forEach((f) => {
            const input = document.getElementById(f.id);
            if (!input) return;
            clearError(input);

            const val = input.value;
            if (val === null || val === "") {
              setError(input, `${f.name} is required.`);
              valid = false;
            } else if (f.type === "number") {
              const num = parseFloat(val);
              if (isNaN(num) || num < 0) {
                setError(input, `${f.name} must be a positive number.`);
                valid = false;
              }
            }
          });

          if (!valid) {
            const firstInvalid = form.querySelector(".is-invalid");
            if (firstInvalid) firstInvalid.focus();
            return;
          }

          const submitBtn = form.querySelector('button[type="submit"]');
          if (submitBtn) submitBtn.disabled = true;

          const modeInput = document.getElementById("planMode");
          const idInput = document.getElementById("planId");
          const planMode = modeInput ? modeInput.value : "add";
          const planId = idInput ? idInput.value : "";

          // Check authenticated session
          try {
            const {
              data: { session },
            } = await supabase.auth.getSession();
            if (!session) {
              showAlert("warning", "Please log in before creating a plan.");
              if (submitBtn) submitBtn.disabled = false;
              return;
            }
          } catch (err) {
            console.error("Auth check failed", err);
            showAlert("danger", "Authentication check failed.");
            if (submitBtn) submitBtn.disabled = false;
            return;
          }

          const payload = {
            title: document.getElementById("title").value,
            start_date: document.getElementById("start_date").value,
            end_date: document.getElementById("end_date").value,
            investment:
              parseFloat(document.getElementById("investment").value) || 0,
            expected_return:
              parseFloat(document.getElementById("expected_return").value) || 0,
            daily_collection_amount:
              parseFloat(
                document.getElementById("daily_collection_amount").value,
              ) || 0,
          };

          try {
            const query =
              planMode === "edit" && planId
                ? supabase.from("plans").update(payload).eq("id", planId)
                : supabase.from("plans").insert([payload]);

            const { data, error } = await query.select();
            if (error) throw error;

            const modalEl = document.getElementById("addPlanModal");
            const modalInstance =
              bootstrap.Modal.getInstance(modalEl) ||
              new bootstrap.Modal(modalEl);
            modalInstance.hide();
            resetPlanModal();
            showAlert(
              "success",
              planMode === "edit"
                ? "Plan updated successfully."
                : "Plan created successfully.",
            );
            // refresh list
            if (typeof loadPlans === "function") loadPlans();
          } catch (err) {
            console.error("Supabase insert error:", err);
            const msg = err.message || JSON.stringify(err);
            showAlert(
              "danger",
              planMode === "edit"
                ? "Failed to update plan: " + msg
                : "Failed to create plan: " + msg,
            );
          } finally {
            if (submitBtn) submitBtn.disabled = false;
          }
        });

        document.addEventListener("click", function (event) {
          const editButton = event.target.closest(".plan-edit-btn");
          if (editButton) {
            openPlanModal({
              id: editButton.dataset.planId,
              title: editButton.dataset.planTitle,
              start_date: editButton.dataset.planStart,
              end_date: editButton.dataset.planEnd,
              investment: editButton.dataset.planInvestment,
              expected_return: editButton.dataset.planExpectedReturn,
              daily_collection_amount: editButton.dataset.planDaily,
            });
            return;
          }

          const deleteButton = event.target.closest(".plan-delete-btn");
          if (!deleteButton) return;

          openDeleteModal({
            id: deleteButton.dataset.planId,
            title: deleteButton.dataset.planTitle,
          });
        });

        const confirmDeleteButton = document.getElementById(
          "confirmDeletePlanButton",
        );
        if (confirmDeleteButton) {
          confirmDeleteButton.addEventListener("click", async function () {
            const planId = confirmDeleteButton.dataset.planId;
            if (!planId) {
              showAlert("warning", "No plan selected for deletion.");
              return;
            }

            try {
              const { data: sessionData } = await supabase.auth.getSession();
              const session = sessionData?.session || null;
              if (!session) {
                showAlert("warning", "Please log in before deleting a plan.");
                return;
              }

              const { error } = await supabase
                .from("plans")
                .delete()
                .eq("id", planId);
              if (error) throw error;

              const modal = getModalInstance("deletePlanModal");
              if (modal) modal.hide();
              showAlert("success", "Plan deleted successfully.");
              if (typeof loadPlans === "function") loadPlans();
            } catch (err) {
              console.error("Failed to delete plan", err);
              showAlert(
                "danger",
                "Failed to delete plan: " +
                  (err.message || JSON.stringify(err)),
              );
            }
          });
        }

        // Clear error on input
        fields.forEach((f) => {
          const input = document.getElementById(f.id);
          if (!input) return;
          input.addEventListener("input", function () {
            if (input.classList.contains("is-invalid")) clearError(input);
          });
        });

        // Alert helper
        function showAlert(type, message) {
          const container = document.getElementById("alertsContainer");
          if (!container) return;

          const wrapper = document.createElement("div");
          wrapper.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show rounded-4" role="alert">
              ${message}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          `;

          container.prepend(wrapper);

          // auto-dismiss after 6s
          setTimeout(() => {
            const alertEl = wrapper.querySelector(".alert");
            if (alertEl) {
              const bsAlert = bootstrap.Alert.getOrCreateInstance(alertEl);
              bsAlert.close();
            }
          }, 6000);
        }

        // Load and render plans
        async function loadPlans() {
          try {
            const { data, error } = await supabase
              .from("plans")
              .select("*")
              .order("start_date", { ascending: false });
            if (error) throw error;
            renderTable(data || []);
            renderGrid(data || []);
          } catch (err) {
            console.error("Failed to load plans", err);
            showAlert(
              "danger",
              "Failed to load plans: " + (err.message || JSON.stringify(err)),
            );
          }
        }

        function formatDateDMY(dateStr) {
          if (!dateStr) return "";
          const d = new Date(dateStr);
          if (isNaN(d)) return "";
          const months = [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun",
            "Jul",
            "Aug",
            "Sep",
            "Oct",
            "Nov",
            "Dec",
          ];
          const day = String(d.getDate()).padStart(2, "0");
          const mon = months[d.getMonth()];
          const year = d.getFullYear();
          return `${day}-${mon}-${year}`;
        }

        function formatDateInputValue(date) {
          const offset = date.getTimezoneOffset() * 60000;
          return new Date(date.getTime() - offset).toISOString().slice(0, 10);
        }

        function getModalInstance(modalId) {
          const modalEl = document.getElementById(modalId);
          if (!modalEl || !window.bootstrap || !bootstrap.Modal) return null;
          return bootstrap.Modal.getOrCreateInstance(modalEl);
        }

        function resetPlanModal() {
          const form = document.getElementById("addPlanForm");
          const titleEl = document.getElementById("addPlanModalLabel");
          const saveButton = document.getElementById("planSaveButton");
          const modeInput = document.getElementById("planMode");
          const idInput = document.getElementById("planId");

          if (form) form.reset();
          if (titleEl) titleEl.textContent = "Add Plan";
          if (saveButton) saveButton.textContent = "Save";
          if (modeInput) modeInput.value = "add";
          if (idInput) idInput.value = "";
        }

        function openPlanModal(plan) {
          const titleEl = document.getElementById("addPlanModalLabel");
          const saveButton = document.getElementById("planSaveButton");
          const modeInput = document.getElementById("planMode");
          const idInput = document.getElementById("planId");

          if (titleEl) titleEl.textContent = "Edit Plan";
          if (saveButton) saveButton.textContent = "Update";
          if (modeInput) modeInput.value = "edit";
          if (idInput) idInput.value = String(plan.id || "");

          const titleInput = document.getElementById("title");
          const startInput = document.getElementById("start_date");
          const endInput = document.getElementById("end_date");
          const investmentInput = document.getElementById("investment");
          const expectedReturnInput =
            document.getElementById("expected_return");
          const dailyCollectionInput = document.getElementById(
            "daily_collection_amount",
          );

          if (titleInput) titleInput.value = plan.title || "";
          if (startInput) startInput.value = plan.start_date || "";
          if (endInput) endInput.value = plan.end_date || "";
          if (investmentInput) investmentInput.value = plan.investment ?? "";
          if (expectedReturnInput)
            expectedReturnInput.value = plan.expected_return ?? "";
          if (dailyCollectionInput)
            dailyCollectionInput.value = plan.daily_collection_amount ?? "";

          const modal = getModalInstance("addPlanModal");
          if (modal) modal.show();
        }

        function openDeleteModal(plan) {
          const message = document.getElementById("deletePlanModalMessage");
          const confirmButton = document.getElementById(
            "confirmDeletePlanButton",
          );

          if (message) {
            message.textContent = `Delete plan ${plan.title || ""}? This cannot be undone.`;
          }
          if (confirmButton) {
            confirmButton.dataset.planId = String(plan.id || "");
          }

          const modal = getModalInstance("deletePlanModal");
          if (modal) modal.show();
        }

        const addPlanModalEl = document.getElementById("addPlanModal");
        if (addPlanModalEl) {
          addPlanModalEl.addEventListener("hidden.bs.modal", resetPlanModal);
        }

        function renderTable(plans) {
          const tbody = document.querySelector("#tableView table tbody");
          if (!tbody) return;
          if (!plans || plans.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="9" class="text-center">No plans found.</td></tr>';
            return;
          }

          tbody.innerHTML = plans
            .map((p, i) => {
              const start = formatDateDMY(p.start_date);
              const end = formatDateDMY(p.end_date);
              const status =
                new Date(p.end_date) >= new Date() ? "Active" : "Closed";
              return `
              <tr>
                <td>${i + 1}</td>
                <td>${escapeHtml(p.title || "")}</td>
                <td>${start}</td>
                <td>${end}</td>
                <td>${formatNumber(p.investment)}</td>
                <td>${formatNumber(p.expected_return)}</td>
                <td>${formatNumber(p.daily_collection_amount)}</td>
                <td><span class="badge bg-label-primary me-1">${status}</span></td>
                <td>
                  <div class="d-flex gap-2 flex-wrap">
                    <a href="./show.html?id=${p.id || ""}" class="btn btn-primary"><i class="bx bx-chevron-right"></i></a>
                    <button type="button" class="btn btn-sm btn-label-primary plan-edit-btn" data-plan-id="${p.id || ""}" data-plan-title="${escapeHtml(p.title || "")}" data-plan-start="${escapeHtml(p.start_date || "")}" data-plan-end="${escapeHtml(p.end_date || "")}" data-plan-investment="${escapeHtml(p.investment ?? "")}" data-plan-expected-return="${escapeHtml(p.expected_return ?? "")}" data-plan-daily="${escapeHtml(p.daily_collection_amount ?? "")}"><i class="bx bx-edit-alt me-md-1"></i><span class="d-none d-md-inline">Edit</span></button>
                    <button type="button" class="btn btn-sm btn-label-danger plan-delete-btn" data-plan-id="${p.id || ""}" data-plan-title="${escapeHtml(p.title || "")}"><i class="bx bx-trash me-md-1"></i><span class="d-none d-md-inline">Delete</span></button>
                  </div>
                </td>
              </tr>`;
            })
            .join("");
        }

        function renderGrid(plans) {
          const grid = document.querySelector("#gridView .row");
          if (!grid) return;
          if (!plans || plans.length === 0) {
            grid.innerHTML = '<div class="col">No plans found.</div>';
            return;
          }

          grid.innerHTML = plans
            .map((p, idx) => {
              const start = formatDateDMY(p.start_date);
              const end = formatDateDMY(p.end_date);
              return `
            <div class="col-12 col-md-4">
              <div class="card border border-light border-opacity-50 shadow-sm rounded h-100 rounded-5">
                <div class="card-body d-flex flex-column p-3 p-md-6">
                  <div class="d-flex align-items-start justify-content-between">
                    <div class="me-3 flex-grow-1">
                      <h5 class="mb-1 fw-semibold text-truncate">${escapeHtml(p.title || "")}</h5>
                      <small class="text-muted d-block fs-7"><span class="d-block">Start: ${start}</span><span class="d-block">End: ${end}</span></small>
                    </div>
                    <div class="d-flex align-items-start gap-2">
                      <span class="badge rounded-pill bg-primary px-3 py-2">${idx + 1}</span>
                      <span class="badge rounded-pill bg-label-primary px-3 py-2 fs-7">Active</span>
                    </div>
                  </div>
                  <hr class="my-4" />
                  <div class="row g-2 mb-4">
                    <div class="col-4">
                      <div class="bg-primary bg-opacity-10 border border-primary border-opacity-10 rounded-4 text-center p-3 px-2 h-100">
                        <small class="text-muted d-block mb-1 text-primary">Investment</small>
                        <h6 class="mb-0 fw-bold">${formatNumber(p.investment)}</h6>
                      </div>
                    </div>
                    <div class="col-4">
                      <div class="bg-success bg-opacity-10 border border-success border-opacity-10 rounded-4 text-center p-3 px-2 h-100">
                        <small class="text-muted d-block mb-1 text-success">Return</small>
                        <h6 class="mb-0 fw-bold">${formatNumber(p.expected_return)}</h6>
                      </div>
                    </div>
                    <div class="col-4">
                      <div class="bg-warning bg-opacity-10 border border-warning border-opacity-10 rounded-4 text-center p-3 px-2 h-100">
                        <small class="text-muted d-block mb-1 text-warning">Daily</small>
                        <h6 class="mb-0 fw-bold">${formatNumber(p.daily_collection_amount)}</h6>
                      </div>
                    </div>
                  </div>
                  <div class="mt-auto d-flex justify-content-between gap-2 align-items-center">
                    <a href="./show.html?id=${p.id || ""}" class="btn btn-primary rounded rounded-4 col"><span class="icon-base bx bx-show icon-sm me-md-2"></span><span class="d-none d-md-inline">Details</span></a>

                    <div class="dropdown col-auto">
                      <button class="btn text-body-secondary p-0" type="button" id="timelineWapper-${p.id || idx}" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <i class="icon-base bx bx-dots-vertical-rounded icon-lg"></i>
                      </button>
                      <div class="dropdown-menu dropdown-menu-end" aria-labelledby="timelineWapper-${p.id || idx}">
                        <button type="button" class="dropdown-item plan-edit-btn" data-plan-id="${p.id || ""}" data-plan-title="${escapeHtml(p.title || "")}" data-plan-start="${escapeHtml(p.start_date || "")}" data-plan-end="${escapeHtml(p.end_date || "")}" data-plan-investment="${escapeHtml(p.investment ?? "")}" data-plan-expected-return="${escapeHtml(p.expected_return ?? "")}" data-plan-daily="${escapeHtml(p.daily_collection_amount ?? "")}">
                          <span class="icon-base bx bx-edit-alt icon-sm me-md-2"></span> Edit
                        </button>
                        <button type="button" class="dropdown-item text-danger plan-delete-btn" data-plan-id="${p.id || ""}" data-plan-title="${escapeHtml(p.title || "")}">
                          <span class="icon-base bx bx-trash icon-sm me-md-2"></span> Delete
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>`;
            })
            .join("");
        }

        function formatNumber(v) {
          if (v === null || v === undefined) return "";
          return Number(v).toLocaleString();
        }

        function escapeHtml(str) {
          return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        // Logout button handler
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", async function (e) {
            e.preventDefault();
            try {
              await supabase.auth.signOut();
              window.location.href = "./login.html";
            } catch (err) {
              console.error("Sign out failed:", err);
            }
          });
        }

        // initial load
        loadPlans();
      });
    </script>
  </body>
</html>
