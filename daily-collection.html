    <script>
      function formatDateDMY(date) {
        if (!date) return "";
        const d = parseDateOnly(date);
        if (Number.isNaN(d.getTime())) return "";
        const months = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        const day = String(d.getDate()).padStart(2, "0");
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
      }

      function parseDateOnly(dateValue) {
        if (dateValue instanceof Date) {
          return new Date(
            dateValue.getFullYear(),
            dateValue.getMonth(),
            dateValue.getDate(),
          );
        }

        const [year, month, day] = String(dateValue).split("-").map(Number);
        if (!year || !month || !day) return new Date(NaN);
        return new Date(year, month - 1, day);
      }

      function calculateInclusiveDays(startDateStr, endDateStr) {
        const start = parseDateOnly(startDateStr);
        const end = parseDateOnly(endDateStr);

        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
          return 0;
        }

        const startUtc = new Date(
          start.getFullYear(),
          start.getMonth(),
          start.getDate(),
        );
        const endUtc = new Date(
          end.getFullYear(),
          end.getMonth(),
          end.getDate(),
        );

        const diffMs = endUtc.getTime() - startUtc.getTime();
        const diffDays = diffMs / (1000 * 60 * 60 * 24);
        return Math.floor(diffDays) + 1;
      }

      function findDailyRateForDate(date, rates) {
        let applicableRate = null;
        rates.forEach((rate) => {
          if (calculateInclusiveDays(rate.effective_from, date) >= 1) {
            applicableRate = rate;
          }
        });
        return applicableRate;
      }

      function calculateMilestoneDate(startDate, milestone, achievements) {
        const baseDate = parseDateOnly(startDate);
        baseDate.setDate(baseDate.getDate() + milestone - 1);

        let adjustedDate = baseDate;
        for (let iteration = 0; iteration < achievements.length + 1; iteration++) {
          const extraDaysBeforeMilestone = achievements
            .filter(
              (achievement) =>
                parseDateOnly(achievement.transaction_date) <= adjustedDate,
            )
            .reduce((total, achievement) => total + achievement.extraDays, 0);
          const nextDate = parseDateOnly(startDate);
          nextDate.setDate(
            nextDate.getDate() + milestone - 1 - extraDaysBeforeMilestone,
          );
          if (nextDate.getTime() === adjustedDate.getTime()) return nextDate;
          adjustedDate = nextDate;
        }
        return adjustedDate;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function showAlert(message, type = "danger") {
        const alertsContainer = document.getElementById("alertsContainer");
        if (!alertsContainer) return;
        alertsContainer.innerHTML = `
          <div class="alert alert-${type}" role="alert">${message}</div>
        `;
      }

      let currentGoal = null;
      let currentRates = [];

      function setGoalForm(goal) {
        document.getElementById("goalName").value = goal?.goal_name || "";
        document.getElementById("goalStartDate").value = goal?.start_date || "";
        document.getElementById("goalTargetAmount").value =
          goal?.target_amount ?? "";
      }

      function renderRatesTable(rates) {
        const tableBody = document.getElementById("ratesTableBody");
        if (!tableBody) return;
        if (!rates.length) {
          tableBody.innerHTML =
            '<tr><td colspan="2" class="text-muted">No daily rates configured.</td></tr>';
          return;
        }
        tableBody.innerHTML = rates
          .map(
            (rate) => `
              <tr>
                <td>${formatDateDMY(rate.effective_from)}</td>
                <td class="text-end">${Number(rate.daily_amount).toLocaleString(undefined, {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2,
                })}</td>
              </tr>
            `,
          )
          .join("");
      }

      async function saveGoal(event) {
        event.preventDefault();
        const goalName = document.getElementById("goalName").value.trim();
        const startDate = document.getElementById("goalStartDate").value;
        const targetValue = document.getElementById("goalTargetAmount").value;
        const saveButton = document.getElementById("saveGoalButton");
        if (!goalName || !startDate) return;

        saveButton.disabled = true;
        try {
          const payload = {
            goal_name: goalName,
            start_date: startDate,
            target_amount: targetValue ? Number(targetValue) : null,
          };
          const query = currentGoal
            ? supabase
                .from("savings_goals")
                .update(payload)
                .eq("id", currentGoal.id)
            : supabase.from("savings_goals").insert(payload);
          const { error } = await query;
          if (error) throw error;
          showAlert("Goal saved successfully.", "success");
          await loadSavingsGoal();
          bootstrap.Modal.getOrCreateInstance(
            document.getElementById("goalModal"),
          ).hide();
        } catch (error) {
          console.error("Failed to save savings goal:", error);
          showAlert(`Failed to save goal: ${error.message || error}`);
        } finally {
          saveButton.disabled = false;
        }
      }

      async function saveDailyRate(event) {
        event.preventDefault();
        if (!currentGoal) {
          showAlert("Create a savings goal before adding a daily rate.", "warning");
          return;
        }
        const amount = Number(document.getElementById("dailyAmount").value);
        const effectiveFrom = document.getElementById("rateEffectiveFrom").value;
        const saveButton = document.getElementById("saveRateButton");
        if (!amount || amount <= 0 || !effectiveFrom) return;

        saveButton.disabled = true;
        try {
          const { error } = await supabase
            .from("savings_daily_rates")
            .upsert(
              {
                goal_id: currentGoal.id,
                daily_amount: amount,
                effective_from: effectiveFrom,
              },
              { onConflict: "goal_id,effective_from" },
            );
          if (error) throw error;
          document.getElementById("dailyAmount").value = "";
          document.getElementById("rateEffectiveFrom").value = "";
          showAlert("Daily rate saved successfully.", "success");
          await loadSavingsGoal();
        } catch (error) {
          console.error("Failed to save daily rate:", error);
          showAlert(`Failed to save daily rate: ${error.message || error}`);
        } finally {
          saveButton.disabled = false;
        }
      }

      async function loadSavingsGoal() {
        const { data: goals, error: goalError } = await supabase
          .from("savings_goals")
          .select("*")
          .order("start_date", { ascending: false })
          .limit(1);

        if (goalError) throw goalError;
        const goal = goals?.[0];
        if (!goal) {
          currentGoal = null;
          currentRates = [];
          setGoalForm(null);
          renderRatesTable([]);
          throw new Error("No savings goal was found. Create one below.");
        }
        currentGoal = goal;
        setGoalForm(goal);

        const [{ data: rates, error: ratesError }, { data: transactions, error: transactionsError }] =
          await Promise.all([
            supabase
              .from("savings_daily_rates")
              .select("daily_amount, effective_from")
              .eq("goal_id", goal.id)
              .order("effective_from", { ascending: true }),
            supabase
              .from("savings_transactions")
              .select("amount, transaction_date")
              .eq("goal_id", goal.id)
              .order("transaction_date", { ascending: true }),
          ]);

        if (ratesError) throw ratesError;
        if (transactionsError) throw transactionsError;
        currentRates = rates || [];
        renderRatesTable(currentRates);

        const currentDate = new Date();
        const achievements = (transactions || [])
          .map((transaction) => {
            const isIncluded =
              calculateInclusiveDays(transaction.transaction_date, currentDate) >= 1 &&
              calculateInclusiveDays(goal.start_date, transaction.transaction_date) >= 1;
            if (!isIncluded) return null;

            const rate = findDailyRateForDate(
              transaction.transaction_date,
              rates || [],
            );
            if (!rate || Number(rate.daily_amount) <= 0) return null;
            return {
              ...transaction,
              extraDays: Number(transaction.amount) / Number(rate.daily_amount),
            };
          })
          .filter(Boolean);
        const extraDays = achievements.reduce(
          (total, achievement) => total + achievement.extraDays,
          0,
        );

        const totalDaysEl = document.getElementById("totalDaysCount");
        const startDateEl = document.getElementById("dayStartDate");
        const endDateEl = document.getElementById("dayEndDate");
        if (totalDaysEl) {
          totalDaysEl.textContent = Number(
            calculateInclusiveDays(goal.start_date, currentDate) + extraDays,
          ).toLocaleString(undefined, { maximumFractionDigits: 2 });
        }
        if (startDateEl) startDateEl.textContent = formatDateDMY(goal.start_date);
        if (endDateEl) endDateEl.textContent = formatDateDMY(currentDate);
        renderAchievementTimeline(
          goal.start_date,
          currentDate,
          achievements,
          extraDays,
        );
      }

      function renderAchievementTimeline(
        startDate,
        currentDate,
        extraAchievements = [],
        extraDays = 0,
      ) {
        const timeline = document.getElementById("achievementTimeline");
        if (!timeline) return;

        const calendarDays = calculateInclusiveDays(startDate, currentDate);
        const currentDays = calendarDays + extraDays;
        if (currentDays < 1) {
          timeline.innerHTML =
            '<li class="timeline-item timeline-item-transparent mb-0">' +
            '<span class="timeline-indicator-advanced timeline-indicator-secondary"><i class="bx bx-time-five"></i></span>' +
            '<div class="timeline-event p-3"><div class="timeline-header"><h6 class="mb-0">No achievements yet</h6><small class="text-muted">Day 1</small></div><p class="mb-0 text-muted">Your first milestone is ahead.</p></div>' +
            '</li>';
          return;
        }

        const nextMilestone = (Math.floor(currentDays / 100) + 1) * 100;
        const cycleStart = nextMilestone - 100;
        const progress = Math.min(
          100,
          Math.max(0, Math.round(((currentDays - cycleStart) / 100) * 100)),
        );
        const progressEl = document.getElementById("achievementProgress");
        const progressTextEl = document.getElementById("achievementProgressText");
        const statusEl = document.getElementById("achievementStatus");
        if (progressEl) {
          progressEl.style.width = `${progress}%`;
          progressEl.setAttribute("aria-valuenow", progress);
        }
        if (progressTextEl) {
          progressTextEl.textContent = `${progress}%`;
        }
        if (statusEl) statusEl.textContent = `Day ${currentDays} of ${nextMilestone}`;
        const milestones = [];

        milestones.push({
          date: parseDateOnly(startDate),
          html: `
            <li class="timeline-item mb-4">
              <span class="timeline-indicator-advanced mt-2 timeline-indicator-success">
                <i class="icon-base bx bx-flag"></i>
              </span>
              <div class="timeline-event p-3">
                <div class="d-flex justify-content-between border-bottom mb-2 pb-2">
                  <h6 class="mb-0">Journey Started</h6>
                  <small class="text-muted">${formatDateDMY(startDate)}</small>
                </div>
              </div>
            </li>
          `,
        });

        for (let milestone = nextMilestone; milestone >= 100; milestone -= 100) {
          const milestoneDate = calculateMilestoneDate(
            startDate,
            milestone,
            extraAchievements,
          );
          const isCompleted = milestone <= currentDays;
          milestones.push({
            date: milestoneDate,
            html: `
            <li class="timeline-item mb-4">
              <span class="timeline-indicator-advanced mt-2 ${isCompleted ? "timeline-indicator-success" : "timeline-indicator-primary"}">
                <i class="icon-base bx ${isCompleted ? "bx-check" : "bx-lock-open-alt"}"></i>
              </span>
              <div class="timeline-event p-3">
                <div class="d-flex justify-content-between border-bottom mb-2 pb-2">
                  <h6 class="mb-0">${milestone}</h6>
                  <small class="text-muted">${formatDateDMY(milestoneDate)}</small>
                </div>
              </div>
            </li>
          `,
          });
        }

        extraAchievements.forEach((achievement) => {
          milestones.push({
            date: parseDateOnly(achievement.transaction_date),
            html: `
              <li class="timeline-item mb-4">
                <span class="timeline-indicator-advanced mt-2 timeline-indicator-success">
                  <i class="icon-base bx bx-plus"></i>
                </span>
                <div class="timeline-event p-3">
                  <div class="d-flex justify-content-between border-bottom mb-2 pb-2">
                    <h6 class="mb-0">+${achievement.extraDays}</h6>
                    <small class="text-muted">${formatDateDMY(achievement.transaction_date)}</small>
                  </div>
                </div>
              </li>
            `,
          });
        });

        timeline.innerHTML = milestones
          .sort((left, right) => right.date - left.date)
          .map((achievement) => achievement.html)
          .join("");
      }

      document.addEventListener("DOMContentLoaded", async function () {
        document.getElementById("goalForm")?.addEventListener("submit", saveGoal);
        document
          .getElementById("saveRateButton")
          ?.addEventListener("click", saveDailyRate);
        try {
          await loadSavingsGoal();
        } catch (error) {
          console.error("Failed to load savings goal:", error);
          showAlert("Unable to load the savings counter. Please try again later.");
        }
      });
    </script>
