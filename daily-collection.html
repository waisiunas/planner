    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.35.0/dist/umd/supabase.min.js"></script>
    <script>
      const SUPABASE_URL = "https://pfqqsyboqnscqhblhnwx.supabase.co";
      const SUPABASE_KEY = document.querySelector(
        'meta[name="supabase-key"]',
      ).content;
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // Auth Guard: If not logged in, redirect to login page immediately
      (async function checkAuth() {
        try {
          const {
            data: { session },
          } = await supabase.auth.getSession();
          if (!session) {
            window.location.href = "./login.html";
          }
        } catch (err) {
          console.error("Auth guard check failed", err);
        }
      })();

    <!-- Page JS -->
    <script>
      function formatDateDMY(date) {
        if (!date) return "";
        const d = new Date(date);
        if (Number.isNaN(d.getTime())) return "";
        const months = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        const day = String(d.getDate()).padStart(2, "0");
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
      }

      function calculateInclusiveDays(startDateStr, endDateStr) {
        const start = new Date(startDateStr);
        const end = new Date(endDateStr);

        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
          return 0;
        }

        const startUtc = new Date(
          start.getFullYear(),
          start.getMonth(),
          start.getDate(),
        );
        const endUtc = new Date(
          end.getFullYear(),
          end.getMonth(),
          end.getDate(),
        );

        const diffMs = endUtc.getTime() - startUtc.getTime();
        const diffDays = diffMs / (1000 * 60 * 60 * 24);
        return Math.floor(diffDays) + 1;
      }

      function renderAchievementTimeline(startDate, currentDate) {
        const timeline = document.getElementById("achievementTimeline");
        if (!timeline) return;

        const currentDays = calculateInclusiveDays(startDate, currentDate);
        if (currentDays < 1) {
          timeline.innerHTML =
            '<li class="timeline-item timeline-item-transparent mb-0">' +
            '<span class="timeline-indicator-advanced timeline-indicator-secondary"><i class="bx bx-time-five"></i></span>' +
            '<div class="timeline-event p-3"><div class="timeline-header"><h6 class="mb-0">No achievements yet</h6><small class="text-muted">Day 1</small></div><p class="mb-0 text-muted">Your first milestone is ahead.</p></div>' +
            '</li>';
          return;
        }

        const nextMilestone = (Math.floor(currentDays / 100) + 1) * 100;
        const cycleStart = nextMilestone - 100;
        const progress = Math.min(
          100,
          Math.max(0, Math.round(((currentDays - cycleStart) / 100) * 100)),
        );
        const progressEl = document.getElementById("achievementProgress");
        const progressTextEl = document.getElementById("achievementProgressText");
        const statusEl = document.getElementById("achievementStatus");
        if (progressEl) {
          progressEl.style.width = `${progress}%`;
          progressEl.setAttribute("aria-valuenow", progress);
        }
        if (progressTextEl) {
          progressTextEl.textContent = `${progress}%`;
        }
        if (statusEl) statusEl.textContent = `Day ${currentDays} of ${nextMilestone}`;
        const milestones = [];

        for (let milestone = nextMilestone; milestone >= 100; milestone -= 100) {
          const milestoneDate = new Date(startDate);
          milestoneDate.setDate(milestoneDate.getDate() + milestone - 1);
          const isCompleted = milestone <= currentDays;
          milestones.push(`
            <li class="timeline-item mb-4">
              <span class="timeline-indicator-advanced mt-2 ${isCompleted ? "timeline-indicator-success" : "timeline-indicator-primary"}">
                <i class="icon-base bx ${isCompleted ? "bx-check" : "bx-lock-open-alt"}"></i>
              </span>
              <div class="timeline-event p-3">
                <div class="d-flex justify-content-between border-bottom mb-2 pb-2">
                  <h6 class="mb-0">${milestone} days</h6>
                  <small class="text-muted">${formatDateDMY(milestoneDate)}</small>
                </div>
              </div>
            </li>
          `);
        }

        timeline.innerHTML = milestones.join("");
      }

      document.addEventListener("DOMContentLoaded", function () {
        const startDate = "2025-08-01";
        const endDate = new Date();

        const totalDays = calculateInclusiveDays(startDate, endDate);
        const totalDaysEl = document.getElementById("totalDaysCount");
        const startDateEl = document.getElementById("dayStartDate");
        const endDateEl = document.getElementById("dayEndDate");

        if (totalDaysEl) totalDaysEl.textContent = totalDays + ' days';
        if (startDateEl) startDateEl.textContent = formatDateDMY(startDate);
        if (endDateEl) endDateEl.textContent = formatDateDMY(endDate);
        renderAchievementTimeline(startDate, endDate);
      });
    </script>
  </body>
