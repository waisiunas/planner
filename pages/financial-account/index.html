    <script>
      const SUPABASE_URL = "https://pfqqsyboqnscqhblhnwx.supabase.co";
      const SUPABASE_KEY = document.querySelector(
        'meta[name="supabase-key"]',
      ).content;
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // Auth Guard: If not logged in, redirect to login page immediately
      (async function checkAuth() {
        try {
          const {
            data: { session },
          } = await supabase.auth.getSession();
          if (!session) {
            window.location.href = "./login.html";
          }
        } catch (err) {
          console.error("Auth guard check failed", err);
        }
      })();
    </script>

  <body>
    <!-- Layout wrapper -->
    <div class="layout-wrapper layout-content-navbar">
      <div class="layout-container">
        <!-- Menu -->

        <div data-include-partial="../../partials/sidebar.html"></div>

        <!-- / Menu -->

        <!-- Layout container -->
        <div class="layout-page">
          <!-- Navbar -->

          <div data-include-partial="../../partials/topbar.html"></div>

          <!-- / Navbar -->

          <!-- Content wrapper -->
          <div class="content-wrapper">
            <!-- Content -->
            <div class="container-xxl flex-grow-1 container-p-y">
              <div class="row mb-6">
                <div class="col-6">
                  <h4 class="mb-0">Accounts</h4>

                <div class="col-6 text-end align-self-center">
                  <button
                    type="button"
                    class="rounded-4 btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#addAccountModal"

                    <span class="icon-base bx bx-plus icon-sm me-md-2"></span>
                    <span class="d-none d-md-inline">Account</span>
                  </button>
                </div>
              </div>
              <!-- Alerts -->
              <div class="mt-3" id="alertsContainer"></div>
              <div class="card rounded-5">
                <div class="card-body p-3 p-md-6" id="dataView"></div>
              </div>
            </div>
            <script>
              document.addEventListener("DOMContentLoaded", async function () {
                if (window.__partialsReady) {
                  try {
                    await window.__partialsReady;
                    setSidebarActiveMenuItem("financialAccountMenuItem");
                  } catch (err) {
                    console.error("Failed to load partials", err);
                  }
                }
              });
            </script>
            <!-- / Content -->

            <!-- Footer -->

            <div data-include-partial="../../partials/footer.html"></div>

            <!-- / Footer -->

          </div>

        </div>
        <!-- / Layout page -->

      <!-- Overlay -->

      <!-- Drag Target Area To SlideIn Menu On Small Screens -->
      <div class="drag-target"></div>

    <!-- Core JS -->
    <!-- build:js assets/vendor/js/theme.js  -->

    <!-- Add Account Modal -->
    <div
      class="modal fade"
      id="addAccountModal"
      tabindex="-1"
      aria-labelledby="addAccountModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addAccountModalLabel">
              Add Account Category
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Alert here -->
            <form
              id="addAccountForm"
              action="#supabaseCreateAccountAPI"
              method="POST"
            >
              <input
                type="hidden"
                id="accountMode"
                name="accountMode"
                value="add"
              />
              <input type="hidden" id="accountId" name="accountId" value="" />

              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input
                      type="text"
                      class="form-control"
                      id="title"
                      name="title"
                      placeholder="Account Category title!"
                      value=""
                    />
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="openingBalance" class="form-label"
                      >Opening Balance</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="openingBalance"
                      name="openingBalance"
                      placeholder="Account Opening Balance!"
                      value=""
                    />
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="accountCategoryID" class="form-label"
                      >Account Category</label
                    >
                    <select
                      class="form-select"
                      id="accountCategoryID"
                      name="accountCategoryID"
                    ></select>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                      <option value="true">Active</option>
                      <option value="false">Inactive</option>
                    </select>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              form="addAccountForm"
              id="accountSaveButton"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="deleteAccountModal"
      tabindex="-1"
      aria-labelledby="deleteAccountModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteAccountModalLabel">
              Delete Account
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-0" id="deleteAccountModalMessage">
              Are you sure you want to delete this account category?
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="confirmDeleteAccountButton"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/vendor/libs/jquery/jquery.js"></script>

    <script src="../../assets/vendor/libs/popper/popper.js"></script>
    <script src="../../assets/vendor/js/bootstrap.js"></script>
    <script src="../../assets/vendor/libs/@algolia/autocomplete-js.js"></script>

    <script src="../../assets/vendor/libs/pickr/pickr.js"></script>

    <script src="../../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>

    <script src="../../assets/vendor/libs/hammer/hammer.js"></script>

    <script src="../../assets/vendor/js/menu.js"></script>

    <!-- endbuild -->

    <!-- Vendors JS -->

    <!-- Main JS -->

    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/functions.js"></script>
    <script src="../../assets/js/include-partials.js"></script>

    <!-- Page JS -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const addAccountFormElement = document.querySelector("#addAccountForm");
        if (!addAccountFormElement) return;

        const fields = [
          { id: "title", name: "Title", type: "text" },
          { id: "openingBalance", name: "Opening Balance", type: "number" },
          { id: "accountCategoryID", name: "Account Category", type: "select" },
          { id: "status", name: "Status", type: "select" },
        ];

        function clearError(input) {
          input.classList.remove("is-invalid");
          const next = input.parentNode.querySelector(".invalid-feedback");
          if (next) next.remove();
        }

        function setError(input, message) {
          input.classList.add("is-invalid");
          let next = input.parentNode.querySelector(".invalid-feedback");
          if (next) {
            next.textContent = message;
          } else {
            const div = document.createElement("div");
            div.className = "invalid-feedback";
            div.textContent = message;
            input.parentNode.appendChild(div);
          }
        }

        addAccountFormElement.addEventListener("submit", async function (e) {
          e.preventDefault();

          let valid = true;

          fields.forEach((f) => {
            const input = document.querySelector(`#${f.id}`);
            if (!input) return;
            clearError(input);

            const val = input.value;
            if (val === null || val === "") {
              setError(input, `${f.name} is required.`);
              valid = false;
            }
          });

          if (!valid) {
            const firstInvalid =
              addAccountFormElement.querySelector(".is-invalid");
            if (firstInvalid) firstInvalid.focus();
            return;
          }

          const accountSaveButtonElement =
            addAccountFormElement.querySelector("#accountSaveButton");
          if (accountSaveButtonElement)
            accountSaveButtonElement.disabled = true;

          const modeInputElement = document.querySelector("#accountMode");
          const idInputElement = document.querySelector("#accountId");
          const accountMode = modeInputElement ? modeInputElement.value : "add";
          const accountId = idInputElement ? idInputElement.value : "";

          // Check authenticated session
          try {
            const {
              data: { session },
            } = await supabase.auth.getSession();
            if (!session) {
              showAlert(
                "warning",
                "Please log in before creating an account.",
              );
              if (accountSaveButtonElement)
                accountSaveButtonElement.disabled = false;
              return;
            }
          } catch (err) {
            console.error("Auth check failed", err);
            showAlert("danger", "Authentication check failed.");
            if (accountSaveButtonElement)
              accountSaveButtonElement.disabled = false;
            return;
          }

          const payload = {
            title: document.querySelector("#title").value,
            opening_balance: document.querySelector("#openingBalance").value,
            financial_account_category_id:
              document.querySelector("#accountCategoryID").value,
            is_active: document.querySelector("#status").value === "true",
          };

          try {
            const query =
              accountMode === "edit" && accountId
                ? supabase
                    .from("financial_accounts")
                    .update(payload)
                    .eq("id", accountId)
                : supabase.from("financial_accounts").insert([payload]);

            const { data, error } = await query.select();
            if (error) throw error;

            const modalEl = document.querySelector("#addAccountModal");
            const modalInstance =
              bootstrap.Modal.getInstance(modalEl) ||
              new bootstrap.Modal(modalEl);
            modalInstance.hide();
            resetAccountModal();
            showAlert(
              "success",
              accountMode === "edit"
                ? "Account updated successfully."
                : "Account created successfully.",
            );
            await Promise.all([loadAccountCategories(), loadAccounts()]);
          } catch (err) {
            console.error("Supabase insert error:", err);
            const msg = err.message || JSON.stringify(err);
            showAlert(
              "danger",
              accountMode === "edit"
                ? "Failed to update account: " + msg
                : "Failed to create account: " + msg,
            );
          } finally {
            if (accountSaveButtonElement)
              accountSaveButtonElement.disabled = false;
          }
        });

        document.addEventListener("click", function (event) {
          const editButton = event.target.closest(".account-edit-btn");
          if (editButton) {
            openAccountModal({
              id: editButton.dataset.accountId,
              title: editButton.dataset.accountTitle,
              opening_balance: editButton.dataset.accountOpeningBalance,
              financial_account_category_id:
                editButton.dataset.accountCategoryId,
              is_active: editButton.dataset.accountIsActive === "true",
            });
            return;
          }

          const deleteButton = event.target.closest(
            ".account-delete-btn",
          );
          if (!deleteButton) return;

          openDeleteModal({
            id: deleteButton.dataset.accountId,
            title: deleteButton.dataset.accountTitle,
          });
        });

        const confirmDeleteButton = document.getElementById(
          "confirmDeleteAccountButton",
        );
        if (confirmDeleteButton) {
          confirmDeleteButton.addEventListener("click", async function () {
            const accountId = confirmDeleteButton.dataset.accountId;
            if (!accountId) {
              showAlert(
                "warning",
                "No account selected for deletion.",
              );
              return;
            }

            try {
              const { data: sessionData } = await supabase.auth.getSession();
              const session = sessionData?.session || null;
              if (!session) {
                showAlert(
                  "warning",
                  "Please log in before deleting an account.",
                );
                return;
              }

              const { error } = await supabase
                .from("financial_accounts")
                .delete()
                .eq("id", accountId);
              if (error) throw error;

              const modal = getModalInstance("deleteAccountModal");
              if (modal) modal.hide();
              await loadAccounts();
              showAlert("success", "Account deleted successfully.");
            } catch (err) {
              console.error("Failed to delete account", err);
              showAlert(
                "danger",
                "Failed to delete account: " +
                  (err.message || JSON.stringify(err)),
              );
            }
          });
        }

        // Clear error on input
        fields.forEach((f) => {
          const input = document.querySelector(`#${f.id}`);
          if (!input) return;
          input.addEventListener("input", function () {
            if (input.classList.contains("is-invalid")) clearError(input);
          });
        });

        // Alert helper
        function showAlert(type, message) {
          const alertsContainerElement =
            document.querySelector("#alertsContainer");
          if (!alertsContainerElement) return;

          alertsContainerElement.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show rounded-4" role="alert">
              ${message}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          `;

          // auto-dismiss after 6s
          setTimeout(() => {
            const alertElement = alertsContainerElement.querySelector(".alert");
            if (alertElement) {
              const bsAlertElement =
                bootstrap.Alert.getOrCreateInstance(alertElement);
              bsAlertElement.close();
            }
          }, 6000);
        }

        // Load and render account categories
        async function loadAccountCategories() {
          try {
            const { data, error } = await supabase
              .from("financial_account_categories")
              .select("*")
              .order("id", { ascending: true });
            if (error) throw error;
            renderAccountCategories(data || []);
          } catch (err) {
            console.error("Failed to load account categories", err);
            showAlert(
              "danger",
              "Failed to load account categories: " +
                (err.message || JSON.stringify(err)),
            );
          }
        }

        // Load and render accounts
        async function loadAccounts() {
          try {
            const { data, error } = await supabase
              .from("financial_accounts")
              .select(
                "*, financial_account_categories!financial_accounts_financial_account_category_id_fkey(title)",
              )
              .order("id", { ascending: true });
            if (error) throw error;
            renderAccounts(data || []);
          } catch (err) {
            console.error("Failed to load accounts", err);
            showAlert(
              "danger",
              "Failed to load accounts: " +
                (err.message || JSON.stringify(err)),
            );
          }
        }

        function getModalInstance(modalId) {
          const modalEl = document.getElementById(modalId);
          if (!modalEl || !window.bootstrap || !bootstrap.Modal) return null;
          return bootstrap.Modal.getOrCreateInstance(modalEl);
        }

        function resetAccountModal() {
          const addAccountFormElement =
            document.querySelector("#addAccountForm");
          const addAccountModalLabelElement = document.querySelector(
            "#addAccountModalLabel",
          );
          const accountSaveButtonElement =
            document.querySelector("#accountSaveButton");
          const accountModeElement = document.querySelector("#accountMode");
          const accountIdElement = document.querySelector("#accountId");

          if (addAccountFormElement) addAccountFormElement.reset();
          if (addAccountModalLabelElement)
            addAccountModalLabelElement.textContent = "Add Account";
          if (accountSaveButtonElement)
            accountSaveButtonElement.textContent = "Save";
          if (accountModeElement) accountModeElement.value = "add";
          if (accountIdElement) accountIdElement.value = "";
        }

        function openAccountModal(account) {
          const titleEl = document.querySelector("#addAccountModalLabel");
          const saveButton = document.querySelector("#accountSaveButton");
          const modeInput = document.querySelector("#accountMode");
          const idInput = document.querySelector("#accountId");

          if (titleEl) titleEl.textContent = "Edit Account Category";
          if (saveButton) saveButton.textContent = "Update";
          if (modeInput) modeInput.value = "edit";
          if (idInput) idInput.value = String(account.id || "");

          const titleInput = document.querySelector("#title");
          const openingBalanceInput = document.querySelector("#openingBalance");
          const accountCategoryIDInput = document.querySelector("#accountCategoryID");
          const statusInput = document.querySelector("#status");

          if (titleInput) titleInput.value = account.title || "";
          if (openingBalanceInput)
            openingBalanceInput.value =
              account.opening_balance !== undefined && account.opening_balance !== null
                ? account.opening_balance
                : "";
          if (accountCategoryIDInput) {
            accountCategoryIDInput.value =
              account.financial_account_category_id || "";
          }
          if (statusInput)
            statusInput.value = account.is_active ? "true" : "false";

          const modal = getModalInstance("addAccountModal");
          if (modal) modal.show();
        }

        function openDeleteModal(account) {
          const message = document.querySelector("#deleteAccountModalMessage");
          const confirmButton = document.querySelector(
            "#confirmDeleteAccountButton",
          );

          if (message) {
            message.textContent = `Delete account ${account.title || ""}? This cannot be undone.`;
          }
          if (confirmButton) {
            confirmButton.dataset.accountId = String(account.id || "");
          }

          const modal = getModalInstance("deleteAccountModal");
          if (modal) modal.show();
        }

        const addAccountModalEl = document.querySelector("#addAccountModal");
        if (addAccountModalEl) {
          addAccountModalEl.addEventListener(
            "hidden.bs.modal",
            resetAccountModal,
          );
        }

        function renderAccountCategories(data) {
          const accountCategoryIDElement =
            document.querySelector("#accountCategoryID");
          if (!accountCategoryIDElement) return;

          let optionElements = `<option value="">Select a category</option>`;

          optionElements += data
            .map((category) => {
              return `<option value="${category.id || ""}">${escapeHtml(category.title || "")}</option>`;
            })
            .join("");

          accountCategoryIDElement.innerHTML = optionElements;
        }

        function renderAccounts(data) {
          const dataViewElement = document.querySelector("#dataView");
          if (!dataViewElement) return;
          if (!data || data.length === 0) {
            dataViewElement.innerHTML =
              '<div class="text-center alert alert-info m-0 rounded-3">No accounts found!</div>';
            return;
          }

          let dataRecords = "";

          dataRecords = data
            .map((account, i) => {
              const status = account.is_active ? "Active" : "Inactive";
              const categoryTitle =
                account.financial_account_categories?.title ||
                account.financial_account_category_id ||
                "";
              return `
              <tr>
                <td>${i + 1}</td>
                <td>${escapeHtml(account.title || "")}</td>
                <td>${escapeHtml(categoryTitle)}</td>
                <td>${formatNumber(account.opening_balance)}</td>
                <td><span class="badge bg-label-primary me-1">${status}</span></td>
                <td>
                  <div class="d-flex gap-2 flex-wrap">
                    <button type="button" class="btn btn-sm btn-label-primary account-edit-btn" data-account-id="${account.id || ""}" data-account-title="${escapeHtml(account.title || "")}" data-account-opening-balance="${account.opening_balance ?? ""}" data-account-category-id="${account.financial_account_category_id ?? ""}" data-account-is-active="${String(account.is_active)}"><i class="bx bx-edit-alt me-md-1"></i><span class="d-none d-md-inline">Edit</span></button>
                    <button type="button" class="btn btn-sm btn-label-danger account-delete-btn" data-account-id="${account.id || ""}" data-account-title="${escapeHtml(account.title || "")}"><i class="bx bx-trash me-md-1"></i><span class="d-none d-md-inline">Delete</span></button>
                  </div>
                </td>
              </tr>`;
            })
            .join("");

          const dataContainerElement = `<table class="table table-hover table-bordered m-0">
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Opening Balance</th>
                        <th>Status</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                    ${dataRecords}
                    </tbody>
                  </table>`;

          dataViewElement.innerHTML = dataContainerElement;
        }

        function formatNumber(v) {
          if (v === null || v === undefined) return "";
          return Number(v).toLocaleString();
        }

        function escapeHtml(str) {
          return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        // Logout button handler
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", async function (e) {
            e.preventDefault();
            try {
              await supabase.auth.signOut();
              window.location.href = "./login.html";
            } catch (err) {
              console.error("Sign out failed:", err);
            }
          });
        }

        // initial load
        Promise.all([loadAccountCategories(), loadAccounts()]);
      });
    </script>
  </body>
