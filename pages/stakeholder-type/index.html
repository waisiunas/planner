    <script>
      const SUPABASE_URL = "https://pfqqsyboqnscqhblhnwx.supabase.co";
      const SUPABASE_KEY = document.querySelector(
        'meta[name="supabase-key"]',
      ).content;
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // Auth Guard: If not logged in, redirect to login page immediately

        try {
          const {
            data: { session },
          } = await supabase.auth.getSession();
          if (!session) {
            window.location.href = "./login.html";
          }
        } catch (err) {
          console.error("Auth guard check failed", err);
        }
      })();

    <!-- Add StakeholderType Modal -->
    <div
      class="modal fade"
      id="addStakeholderTypeModal"
      tabindex="-1"
      aria-labelledby="addStakeholderTypeModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addStakeholderTypeModalLabel">
              Add Stakeholder Type
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Alert here -->
            <form
              id="addStakeholderTypeForm"
              action="#supabaseCreateStakeholderTypeAPI"
              method="POST"
            >
              <input
                type="hidden"
                id="stakeholderTypeMode"
                name="stakeholderTypeMode"
                value="add"
              />
              <input
                type="hidden"
                id="stakeholderTypeId"
                name="stakeholderTypeId"
                value=""
              />

              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input
                      type="text"
                      class="form-control"
                      id="title"
                      name="title"
                      placeholder="Stakeholder Type title!"
                      value=""
                    />
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                      <option value="true">Active</option>
                      <option value="false">Inactive</option>

                  </div>
                </div>
              </div>
            </form>
          </div>

            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"

              Close

              type="submit"
              class="btn btn-primary"
              form="addStakeholderTypeForm"
              id="stakeholderTypeSaveButton"
            >
              Save
            </button>
          </div>
        </div>
      </div>

    <div
      class="modal fade"
      id="deleteStakeholderTypeModal"
      tabindex="-1"
      aria-labelledby="deleteStakeholderTypeModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteStakeholderTypeModalLabel">
              Delete Stakeholder Type
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-0" id="deleteStakeholderTypeModalMessage">
              Are you sure you want to delete this stakeholder type?
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"

              Cancel
            </button>

              type="button"
              class="btn btn-danger"
              id="confirmDeleteStakeholderTypeButton"
            >
              Delete
            </button>

    <script src="../../assets/vendor/libs/jquery/jquery.js"></script>

    <script src="../../assets/vendor/libs/popper/popper.js"></script>

    <!-- Page JS -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const addStakeholderTypeFormElement = document.querySelector(
          "#addStakeholderTypeForm",
        );
        if (!addStakeholderTypeFormElement) return;

        const fields = [
          { id: "title", name: "Title", type: "text" },
          { id: "status", name: "Status", type: "select" },
        ];

        function clearError(input) {
          input.classList.remove("is-invalid");
          const next = input.parentNode.querySelector(".invalid-feedback");
          if (next) next.remove();
        }

        function setError(input, message) {
          input.classList.add("is-invalid");
          let next = input.parentNode.querySelector(".invalid-feedback");
          if (next) {
            next.textContent = message;
          } else {
            const div = document.createElement("div");
            div.className = "invalid-feedback";
            div.textContent = message;
            input.parentNode.appendChild(div);
          }
        }

        addStakeholderTypeFormElement.addEventListener(
          "submit",
          async function (e) {
            e.preventDefault();

            let valid = true;

            fields.forEach((f) => {
              const input = document.querySelector(`#${f.id}`);
              if (!input) return;
              clearError(input);

              const val = input.value;
              if (val === null || val === "") {
                setError(input, `${f.name} is required.`);
                valid = false;
              }
            });

            if (!valid) {
              const firstInvalid =
                addStakeholderTypeFormElement.querySelector(".is-invalid");
              if (firstInvalid) firstInvalid.focus();
              return;
            }

            const stakeholderTypeSaveButtonElement =
              addStakeholderTypeFormElement.querySelector(
                "#stakeholderTypeSaveButton",
              );
            if (stakeholderTypeSaveButtonElement)
              stakeholderTypeSaveButtonElement.disabled = true;

            const modeInputElement = document.querySelector(
              "#stakeholderTypeMode",
            );
            const idInputElement = document.querySelector("#stakeholderTypeId");
            const stakeholderTypeMode = modeInputElement
              ? modeInputElement.value
              : "add";
            const stakeholderTypeId = idInputElement
              ? idInputElement.value
              : "";

            // Check authenticated session
            try {
              const {
                data: { session },
              } = await supabase.auth.getSession();
              if (!session) {
                showAlert(
                  "warning",
                  "Please log in before creating an stakeholder type.",
                );
                if (stakeholderTypeSaveButtonElement)
                  stakeholderTypeSaveButtonElement.disabled = false;
                return;
              }
            } catch (err) {
              console.error("Auth check failed", err);
              showAlert("danger", "Authentication check failed.");
              if (stakeholderTypeSaveButtonElement)
                stakeholderTypeSaveButtonElement.disabled = false;
              return;
            }

            const payload = {
              title: document.querySelector("#title").value,
              is_active: document.querySelector("#status").value === "true",
            };

            try {
              const query =
                stakeholderTypeMode === "edit" && stakeholderTypeId
                  ? supabase
                      .from("stakeholder_types")
                      .update(payload)
                      .eq("id", stakeholderTypeId)
                  : supabase
                      .from("stakeholder_types")
                      .insert([payload]);

              const { data, error } = await query.select();
              if (error) throw error;

              const modalEl = document.querySelector(
                "#addStakeholderTypeModal",
              );
              const modalInstance =
                bootstrap.Modal.getInstance(modalEl) ||
                new bootstrap.Modal(modalEl);
              modalInstance.hide();
              resetStakeholderTypeModal();
              showAlert(
                "success",
                stakeholderTypeMode === "edit"
                  ? "Stakeholder type updated successfully."
                  : "Stakeholder type created successfully.",
              );
              // refresh list
              if (typeof loadStakeholderTypes === "function")
                loadStakeholderTypes();
            } catch (err) {
              console.error("Supabase insert error:", err);
              const msg = err.message || JSON.stringify(err);
              showAlert(
                "danger",
                stakeholderTypeMode === "edit"
                  ? "Failed to update stakeholder type: " + msg
                  : "Failed to create stakeholder type: " + msg,
              );
            } finally {
              if (stakeholderTypeSaveButtonElement)
                stakeholderTypeSaveButtonElement.disabled = false;
            }
          },
        );

        document.addEventListener("click", function (event) {
          const editButton = event.target.closest(".stakeholder-type-edit-btn");
          if (editButton) {
            openStakeholderTypeModal({
              id: editButton.dataset.stakeholderTypeId,
              title: editButton.dataset.stakeholderTypeTitle,
              is_active: editButton.dataset.stakeholderTypeIsActive === "true",
            });
            return;
          }

          const deleteButton = event.target.closest(
            ".stakeholder-type-delete-btn",
          );
          if (!deleteButton) return;

          openDeleteModal({
            id: deleteButton.dataset.stakeholderTypeId,
            title: deleteButton.dataset.stakeholderTypeTitle,
          });
        });

        const confirmDeleteButton = document.getElementById(
          "confirmDeleteStakeholderTypeButton",
        );
        if (confirmDeleteButton) {
          confirmDeleteButton.addEventListener("click", async function () {
            const stakeholderTypeId =
              confirmDeleteButton.dataset.stakeholderTypeId;
            if (!stakeholderTypeId) {
              showAlert(
                "warning",
                "No stakeholder type selected for deletion.",
              );
              return;
            }

            try {
              const { data: sessionData } = await supabase.auth.getSession();
              const session = sessionData?.session || null;
              if (!session) {
                showAlert(
                  "warning",
                  "Please log in before deleting an stakeholder type.",
                );
                return;
              }

              const { error } = await supabase
                .from("stakeholder_types")
                .delete()
                .eq("id", stakeholderTypeId);
              if (error) throw error;

              const modal = getModalInstance("deleteStakeholderTypeModal");
              if (modal) modal.hide();
              showAlert("success", "Stakeholder type deleted successfully.");
              if (typeof loadStakeholderTypes === "function")
                loadStakeholderTypes();
            } catch (err) {
              console.error("Failed to delete stakeholder type", err);
              showAlert(
                "danger",
                "Failed to delete stakeholder type: " +
                  (err.message || JSON.stringify(err)),
              );
            }
          });
        }

        // Clear error on input
        fields.forEach((f) => {
          const input = document.querySelector(`#${f.id}`);
          if (!input) return;
          input.addEventListener("input", function () {
            if (input.classList.contains("is-invalid")) clearError(input);
          });
        });

        // Alert helper
        function showAlert(type, message) {
          const alertsContainerElement =
            document.querySelector("#alertsContainer");
          if (!alertsContainerElement) return;

          alertsContainerElement.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show rounded-4" role="alert">
              ${message}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          `;

          // auto-dismiss after 6s
          setTimeout(() => {
            const alertElement = alertsContainerElement.querySelector(".alert");
            if (alertElement) {
              const bsAlertElement =
                bootstrap.Alert.getOrCreateInstance(alertElement);
              bsAlertElement.close();
            }
          }, 6000);
        }

        // Load and render stakeholder types
        async function loadStakeholderTypes() {
          try {
            const { data, error } = await supabase
              .from("stakeholder_types")
              .select("*")
              .order("id", { ascending: true });
            if (error) throw error;
            renderData(data || []);
          } catch (err) {
            console.error("Failed to load stakeholder types", err);
            showAlert(
              "danger",
              "Failed to load stakeholder types: " +
                (err.message || JSON.stringify(err)),
            );
          }
        }

        function getModalInstance(modalId) {
          const modalEl = document.getElementById(modalId);
          if (!modalEl || !window.bootstrap || !bootstrap.Modal) return null;
          return bootstrap.Modal.getOrCreateInstance(modalEl);
        }

        function resetStakeholderTypeModal() {
          const addStakeholderTypeFormElement = document.querySelector(
            "#addStakeholderTypeForm",
          );
          const addStakeholderTypeModalLabelElement = document.querySelector(
            "#addStakeholderTypeModalLabel",
          );
          const stakeholderTypeSaveButtonElement = document.querySelector(
            "#stakeholderTypeSaveButton",
          );
          const stakeholderTypeModeElement = document.querySelector(
            "#stakeholderTypeMode",
          );
          const stakeholderTypeIdElement =
            document.querySelector("#stakeholderTypeId");

          if (addStakeholderTypeFormElement)
            addStakeholderTypeFormElement.reset();
          if (addStakeholderTypeModalLabelElement)
            addStakeholderTypeModalLabelElement.textContent =
              "Add Stakeholder Type";
          if (stakeholderTypeSaveButtonElement)
            stakeholderTypeSaveButtonElement.textContent = "Save";
          if (stakeholderTypeModeElement)
            stakeholderTypeModeElement.value = "add";
          if (stakeholderTypeIdElement) stakeholderTypeIdElement.value = "";
        }

        function openStakeholderTypeModal(stakeholderType) {
          const titleEl = document.querySelector(
            "#addStakeholderTypeModalLabel",
          );
          const saveButton = document.querySelector(
            "#stakeholderTypeSaveButton",
          );
          const modeInput = document.querySelector("#stakeholderTypeMode");
          const idInput = document.querySelector("#stakeholderTypeId");

          if (titleEl) titleEl.textContent = "Edit Stakeholder Type";
          if (saveButton) saveButton.textContent = "Update";
          if (modeInput) modeInput.value = "edit";
          if (idInput) idInput.value = String(stakeholderType.id || "");

          const titleInput = document.querySelector("#title");
          const statusInput = document.querySelector("#status");
          const startInput = document.querySelector("#start_date");
          const endInput = document.querySelector("#end_date");
          const investmentInput = document.querySelector("#investment");
          const expectedReturnInput =
            document.querySelector("#expected_return");
          const dailyCollectionInput = document.querySelector(
            "#daily_collection_amount",
          );

          if (titleInput) titleInput.value = stakeholderType.title || "";
          if (statusInput)
            statusInput.value = stakeholderType.is_active ? "true" : "false";
          if (startInput) startInput.value = stakeholderType.start_date || "";
          if (endInput) endInput.value = stakeholderType.end_date || "";
          if (investmentInput)
            investmentInput.value = stakeholderType.investment ?? "";
          if (expectedReturnInput)
            expectedReturnInput.value = stakeholderType.expected_return ?? "";
          if (dailyCollectionInput)
            dailyCollectionInput.value =
              stakeholderType.daily_collection_amount ?? "";

          const modal = getModalInstance("addStakeholderTypeModal");
          if (modal) modal.show();
        }

        function openDeleteModal(stakeholderType) {
          const message = document.querySelector(
            "#deleteStakeholderTypeModalMessage",
          );
          const confirmButton = document.querySelector(
            "#confirmDeleteStakeholderTypeButton",
          );

          if (message) {
            message.textContent = `Delete stakeholder type ${stakeholderType.title || ""}? This cannot be undone.`;
          }
          if (confirmButton) {
            confirmButton.dataset.stakeholderTypeId = String(
              stakeholderType.id || "",
            );
          }

          const modal = getModalInstance("deleteStakeholderTypeModal");
          if (modal) modal.show();
        }

        const addStakeholderTypeModalEl = document.querySelector(
          "#addStakeholderTypeModal",
        );
        if (addStakeholderTypeModalEl) {
          addStakeholderTypeModalEl.addEventListener(
            "hidden.bs.modal",
            resetStakeholderTypeModal,
          );
        }

        function renderData(data) {
          const dataViewElement = document.querySelector("#dataView");
          if (!dataViewElement) return;
          if (!data || data.length === 0) {
            dataViewElement.innerHTML =
              '<div class="text-center alert alert-info m-0 rounded-3">No stakeholder types found!</div>';
            return;
          }

          let dataRecords = "";

          dataRecords = data
            .map((category, i) => {
              const status = category.is_active ? "Active" : "Inactive";
              return `
              <tr>
                <td>${i + 1}</td>
                <td>${escapeHtml(category.title || "")}</td>
                <td><span class="badge bg-label-primary me-1">${status}</span></td>
                <td>
                  <div class="d-flex gap-2 flex-wrap">
                    <button type="button" class="btn btn-sm btn-label-primary stakeholder-type-edit-btn" data-stakeholder-type-id="${category.id || ""}" data-stakeholder-type-title="${escapeHtml(category.title || "")}" data-stakeholder-type-is-active="${String(category.is_active)}"><i class="bx bx-edit-alt me-md-1"></i><span class="d-none d-md-inline">Edit</span></button>
                    <button type="button" class="btn btn-sm btn-label-danger stakeholder-type-delete-btn" data-stakeholder-type-id="${category.id || ""}" data-stakeholder-type-title="${escapeHtml(category.title || "")}"><i class="bx bx-trash me-md-1"></i><span class="d-none d-md-inline">Delete</span></button>
                  </div>
                </td>
              </tr>`;
            })
            .join("");

          const dataContainerElement = `<table class="table table-hover table-bordered m-0">
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                    ${dataRecords}
                    </tbody>
                  </table>`;

          dataViewElement.innerHTML = dataContainerElement;
        }

        function formatNumber(v) {
          if (v === null || v === undefined) return "";
          return Number(v).toLocaleString();
        }

        function escapeHtml(str) {
          return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        // Logout button handler
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", async function (e) {
            e.preventDefault();
            try {
              await supabase.auth.signOut();
              window.location.href = "./login.html";
            } catch (err) {
              console.error("Sign out failed:", err);
            }
          });
        }

        // initial load
        loadStakeholderTypes();
      });
    </script>
  </body>
