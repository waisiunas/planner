    <!-- Page JS -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const addStakeholderFormElement = document.querySelector(
          "#addStakeholderForm",
        );
        if (!addStakeholderFormElement) return;

        const fields = [
          { id: "name", name: "Title", type: "text" },
          { id: "stakeholderTypeId", name: "Stakeholder Type", type: "select" },
          { id: "status", name: "Status", type: "select" },
        ];

        function clearError(input) {
          input.classList.remove("is-invalid");
          const next = input.parentNode.querySelector(".invalid-feedback");
          if (next) next.remove();
        }

        function setError(input, message) {
          input.classList.add("is-invalid");
          let next = input.parentNode.querySelector(".invalid-feedback");
          if (next) {
            next.textContent = message;
          } else {
            const div = document.createElement("div");
            div.className = "invalid-feedback";
            div.textContent = message;
            input.parentNode.appendChild(div);
          }
        }

        addStakeholderFormElement.addEventListener(
          "submit",
          async function (e) {
            e.preventDefault();

            let valid = true;

            fields.forEach((f) => {
              const input = document.querySelector(`#${f.id}`);
              if (!input) return;
              clearError(input);

              const val = input.value;
              if (val === null || val === "") {
                setError(input, `${f.name} is required.`);
                valid = false;
              }
            });

            if (!valid) {
              const firstInvalid =
                addStakeholderFormElement.querySelector(".is-invalid");
              if (firstInvalid) firstInvalid.focus();
              return;
            }

            const stakeholderSaveButtonElement =
              addStakeholderFormElement.querySelector(
                "#stakeholderTypeSaveButton",
              );
            if (stakeholderSaveButtonElement)
              stakeholderSaveButtonElement.disabled = true;

            const modeInputElement = document.querySelector(
              "#stakeholderMode",
            );
            const idInputElement = document.querySelector("#stakeholderId");
            const stakeholderMode = modeInputElement
              ? modeInputElement.value
              : "add";
            const stakeholderId = idInputElement
              ? idInputElement.value
              : "";

            // Check authenticated session
            try {
              const {
                data: { session },
              } = await supabase.auth.getSession();
              if (!session) {
                showAlert(
                  "warning",
                  "Please log in before creating an stakeholder.",
                );
                if (stakeholderSaveButtonElement)
                  stakeholderSaveButtonElement.disabled = false;
                return;
              }
            } catch (err) {
              console.error("Auth check failed", err);
              showAlert("danger", "Authentication check failed.");
              if (stakeholderSaveButtonElement)
                stakeholderSaveButtonElement.disabled = false;
              return;
            }

            const payload = {
              name: document.querySelector("#name").value,
              default_amount:
                document.querySelector("#defaultAmount").value || 0,
              stakeholder_type_id: document.querySelector("#stakeholderTypeId").value,
              is_active: document.querySelector("#status").value === "true",
            };

            try {
              const query =
                stakeholderMode === "edit" && stakeholderId
                  ? supabase
                      .from("stakeholders")
                      .update(payload)
                      .eq("id", stakeholderId)
                  : supabase.from("stakeholders").insert([payload]);

              const { data, error } = await query.select();
              if (error) throw error;

              const modalEl = document.querySelector("#addStakeholderModal");
              const modalInstance =
                bootstrap.Modal.getInstance(modalEl) ||
                new bootstrap.Modal(modalEl);
              modalInstance.hide();
              resetStakeholderModal();
              showAlert(
                "success",
                stakeholderMode === "edit"
                  ? "Stakeholder updated successfully."
                  : "Stakeholder created successfully.",
              );
              // refresh list
              if (typeof loadStakeholders === "function") loadStakeholders();
            } catch (err) {
              console.error("Supabase insert error:", err);
              const msg = err.message || JSON.stringify(err);
              showAlert(
                "danger",
                stakeholderMode === "edit"
                  ? "Failed to update stakeholder: " + msg
                  : "Failed to create stakeholder: " + msg,
              );
            } finally {
              if (stakeholderSaveButtonElement)
                stakeholderSaveButtonElement.disabled = false;
            }
          },
        );

        document.addEventListener("click", function (event) {
          const editButton = event.target.closest(".stakeholder-edit-btn");
          if (editButton) {
            openStakeholderModal({
              id: editButton.dataset.stakeholderId,
              name: editButton.dataset.stakeholderName,
              default_amount: editButton.dataset.stakeholderDefaultAmount,
              stakeholder_type_id: editButton.dataset.stakeholderTypeId,
              is_active: editButton.dataset.stakeholderIsActive === "true",
            });
            return;
          }

          const deleteButton = event.target.closest(
            ".stakeholder-delete-btn",
          );
          if (!deleteButton) return;

          openDeleteModal({
            id: deleteButton.dataset.stakeholderId,
            title: deleteButton.dataset.stakeholderName,
          });
        });

        const confirmDeleteButton = document.getElementById(
          "confirmDeleteStakeholderButton",
        );
        if (confirmDeleteButton) {
          confirmDeleteButton.addEventListener("click", async function () {
            const stakeholderId = confirmDeleteButton.dataset.stakeholderId;
            if (!stakeholderId) {
              showAlert(
                "warning",
                "No stakeholder selected for deletion.",
              );
              return;
            }

            try {
              const { data: sessionData } = await supabase.auth.getSession();
              const session = sessionData?.session || null;
              if (!session) {
                showAlert(
                  "warning",
                  "Please log in before deleting a stakeholder.",
                );
                return;
              }

              const { error } = await supabase
                .from("stakeholders")
                .delete()
                .eq("id", stakeholderId);
              if (error) throw error;

              const modal = getModalInstance("deleteStakeholderModal");
              if (modal) modal.hide();
              showAlert("success", "Stakeholder deleted successfully.");
              if (typeof loadStakeholders === "function")
                loadStakeholders();
            } catch (err) {
              console.error("Failed to delete stakeholder", err);
              showAlert(
                "danger",
                "Failed to delete stakeholder type: " +
                  (err.message || JSON.stringify(err)),
              );
            }
          });
        }

        // Clear error on input
        fields.forEach((f) => {
          const input = document.querySelector(`#${f.id}`);
          if (!input) return;
          input.addEventListener("input", function () {
            if (input.classList.contains("is-invalid")) clearError(input);
          });
        });

        // Alert helper
        function showAlert(type, message) {
          const alertsContainerElement =
            document.querySelector("#alertsContainer");
          if (!alertsContainerElement) return;

          alertsContainerElement.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show rounded-4" role="alert">
              ${message}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          `;

          // auto-dismiss after 6s
          setTimeout(() => {
            const alertElement = alertsContainerElement.querySelector(".alert");
            if (alertElement) {
              const bsAlertElement =
                bootstrap.Alert.getOrCreateInstance(alertElement);
              bsAlertElement.close();
            }
          }, 6000);
        }


        // Load and render stakeholder types
        async function loadStakeholderTypes() {
          try {
            const { data, error } = await supabase
              .from("stakeholder_types")
              .select("*")
              .order("id", { ascending: true });
            if (error) throw error;
            renderStakeholderTypes(data || []);
          } catch (err) {
            console.error("Failed to load stakeholder types", err);
            showAlert(
              "danger",
              "Failed to load stakeholder types: " +
                (err.message || JSON.stringify(err)),
            );
          }
        }

        // Load and render stakeholders
        async function loadStakeholders() {
          try {
            const { data, error } = await supabase
              .from("stakeholders")
              .select(
                "*, stakeholder_types!stakeholders_stakeholder_type_id_fkey(title)",
              )
              .order("id", { ascending: true });
            if (error) throw error;
            renderStakeholders(data || []);
          } catch (err) {
            console.error("Failed to load stakeholders", err);
            showAlert(
              "danger",
              "Failed to load stakeholders: " +
                (err.message || JSON.stringify(err)),
            );
          }
        }

        function getModalInstance(modalId) {
          const modalEl = document.getElementById(modalId);
          if (!modalEl || !window.bootstrap || !bootstrap.Modal) return null;
          return bootstrap.Modal.getOrCreateInstance(modalEl);
        }

        function resetStakeholderModal() {
          const addStakeholderFormElement = document.querySelector(
            "#addStakeholderForm",
          );
          const addStakeholderModalLabelElement = document.querySelector(
            "#addStakeholderModalLabel",
          );
          const stakeholderSaveButtonElement = document.querySelector(
            "#stakeholderTypeSaveButton",
          );
          const stakeholderModeElement = document.querySelector(
            "#stakeholderMode",
          );
          const stakeholderIdElement =
            document.querySelector("#stakeholderId");

          if (addStakeholderFormElement) addStakeholderFormElement.reset();
          if (addStakeholderModalLabelElement)
            addStakeholderModalLabelElement.textContent = "Add Stakeholder";
          if (stakeholderSaveButtonElement)
            stakeholderSaveButtonElement.textContent = "Save";
          if (stakeholderModeElement)
            stakeholderModeElement.value = "add";
          if (stakeholderIdElement) stakeholderIdElement.value = "";
        }

        function openStakeholderModal(stakeholder) {
          const titleEl = document.querySelector("#addStakeholderModalLabel");
          const saveButton = document.querySelector(
            "#stakeholderTypeSaveButton",
          );
          const modeInput = document.querySelector("#stakeholderMode");
          const idInput = document.querySelector("#stakeholderId");

          if (titleEl) titleEl.textContent = "Edit Stakeholder";
          if (saveButton) saveButton.textContent = "Update";
          if (modeInput) modeInput.value = "edit";
          if (idInput) idInput.value = String(stakeholder.id || "");

          const nameInput = document.querySelector("#name");
          const defaultAmountInput = document.querySelector("#defaultAmount");
          const stakeholderTypeInput =
            document.querySelector("#stakeholderTypeId");
          const statusInput = document.querySelector("#status");

          if (nameInput) nameInput.value = stakeholder.name || "";
          if (defaultAmountInput)
            defaultAmountInput.value = stakeholder.default_amount ?? 0;
          if (stakeholderTypeInput)
            stakeholderTypeInput.value = stakeholder.stakeholder_type_id || "";
          if (statusInput)
            statusInput.value = stakeholder.is_active ? "true" : "false";

          const modal = getModalInstance("addStakeholderModal");
          if (modal) modal.show();
        }

        function openDeleteModal(stakeholder) {
          const message = document.querySelector(
            "#deleteStakeholderModalMessage",
          );
          const confirmButton = document.querySelector(
            "#confirmDeleteStakeholderButton",
          );

          if (message) {
            message.textContent = `Delete stakeholder ${stakeholder.title || stakeholder.name || ""}? This cannot be undone.`;
          }
          if (confirmButton) {
            confirmButton.dataset.stakeholderId = String(
              stakeholder.id || "",
            );
          }

          const modal = getModalInstance("deleteStakeholderModal");
          if (modal) modal.show();
        }

        const addStakeholderModalEl = document.querySelector(
          "#addStakeholderModal",
        );
        if (addStakeholderModalEl) {
          addStakeholderModalEl.addEventListener(
            "hidden.bs.modal",
            resetStakeholderModal,
          );
        }

        function renderStakeholderTypes(data) {
          const stakeholderTypeIDElement =
            document.querySelector("#stakeholderTypeId");
          if (!stakeholderTypeIDElement) return;

          let optionElements = `<option value="">Select a stakeholder type!</option>`;

          optionElements += data
            .map((stakeholderType) => {
              return `<option value="${stakeholderType.id || ""}">${escapeHtml(stakeholderType.title || "")}</option>`;
            })
            .join("");

          stakeholderTypeIDElement.innerHTML = optionElements;
        }

        function renderStakeholders(data) {
          const dataViewElement = document.querySelector("#dataView");
          if (!dataViewElement) return;
          if (!data || data.length === 0) {
            dataViewElement.innerHTML =
              '<div class="text-center alert alert-info m-0 rounded-3">No stakeholders found!</div>';
            return;
          }

          const dataRecords = data
            .map((stakeholder, i) => {
              const status = stakeholder.is_active ? "Active" : "Inactive";
              const stakeholderTypeTitle =
                stakeholder.stakeholder_types?.title ||
                stakeholder.stakeholder_type_id ||
                "";
              return `
              <div class="col-12 col-md-6 col-xl-4">
                <div class="card border border-light border-opacity-50 shadow-sm rounded-5 h-100">
                  <div class="card-body d-flex flex-column p-4">
                    <div class="d-flex align-items-start justify-content-between gap-2 mb-4">
                      <div class="d-flex align-items-center gap-3">
                        <span class="avatar avatar-md">
                          <span class="avatar-initial rounded-4 bg-label-primary">
                            <i class="bx bx-group"></i>
                          </span>
                        </span>
                        <div>
                          <h5 class="mb-1">${escapeHtml(stakeholder.name || "")}</h5>
                          <span class="badge bg-label-info rounded-pill">${escapeHtml(stakeholderTypeTitle)}</span>
                        </div>
                      </div>
                      <div class="d-inline-flex align-items-center gap-1">
                        <span class="badge bg-label-primary rounded-pill">${i + 1}</span>
                        <span class="badge bg-label-secondary rounded-pill">${status}</span>
                      </div>
                    </div>
                    <div class="p-3 bg-light bg-opacity-25 rounded-4 border border-light border-opacity-10 mb-4">
                      <small class="text-muted d-block mb-1">Default amount</small>
                      <h5 class="mb-0 text-body">${escapeHtml(stakeholder.default_amount ?? 0)}</h5>
                    </div>
                    <div class="mt-auto d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-primary rounded-4 flex-fill stakeholder-edit-btn" data-stakeholder-id="${stakeholder.id || ""}" data-stakeholder-name="${escapeHtml(stakeholder.name || "")}" data-stakeholder-default-amount="${stakeholder.default_amount ?? ""}" data-stakeholder-type-id="${stakeholder.stakeholder_type_id ?? ""}" data-stakeholder-is-active="${String(stakeholder.is_active)}"><i class="bx bx-edit-alt me-1"></i>Edit</button>
                    ${
                      !stakeholder.is_active
                        ? `<button type="button" class="btn btn-sm btn-label-danger rounded-4 flex-fill stakeholder-delete-btn" data-stakeholder-id="${stakeholder.id || ""}" data-stakeholder-name="${escapeHtml(stakeholder.name || "")}"><i class="bx bx-trash me-1"></i>Delete</button>`
                        : ""
                    }
                  </div>
                  </div>
                </div>
              </div>`;
            })
            .join("");

          const dataContainerElement = `<div class="row g-4">${dataRecords}</div>`;

          dataViewElement.innerHTML = dataContainerElement;
        }

        function formatNumber(v) {
          if (v === null || v === undefined) return "";
          return Number(v).toLocaleString();
        }

        function escapeHtml(str) {
          return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        // Logout button handler
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", async function (e) {
            e.preventDefault();
            try {
              await supabase.auth.signOut();
              window.location.href = "./login.html";
            } catch (err) {
              console.error("Sign out failed:", err);
            }
          });
        }

        // initial load
        Promise.all([loadStakeholderTypes(), loadStakeholders()]);
      });
    </script>
  </body>
</html>
